appId: co.kr.wisdomit.wizbot.player
productName: wizbot player
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# 트레이 아이콘은 실행 중에 읽으므로 asar 밖(Resources/)에 둔다
extraResources:
  - from: resources
    to: .
  # 창·작업 표시줄 아이콘으로 실행 중에 읽는다
  - from: build/icon.png
    to: icon.png
# 코드 서명 인증서가 없다 — 설치 시 SmartScreen/Gatekeeper 경고가 뜬다 (README 참고)
win:
  target:
    - target: nsis
      arch: [x64]
  # ⚠️ signAndEditExecutable 을 끄면 서명뿐 아니라 **아이콘·버전 정보 기록까지** 건너뛴다.
  # 그러면 exe 가 Electron 기본 아이콘 그대로 남는다 (실측).
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 다운로드 페이지가 정적 링크를 쓰도록 버전 없는 이름으로 고정한다 (#117)
  # https://github.com/WisdomIT/wizbot/releases/latest/download/wizbot-player-win-x64.exe
  artifactName: wizbot-player-win-${arch}.exe
mac:
  # ⚠️ arch 를 주지 않으면 러너 아키텍처(macos-latest = Apple Silicon)만 빌드되어
  # 인텔 맥 사용자가 받아도 실행되지 않는다. universal 은 한 파일에 둘을 담아 용량이 두 배다.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
  # ⚠️ 서명 인증서는 없지만 **ad-hoc 서명은 해야 한다.** Apple Silicon 은 서명 없는 arm64 앱을
  # "손상되었기 때문에 열 수 없습니다" 로 아예 막는다 (v1.2.0 실측 — 인텔은 경고만 뜬다).
  # electron-builder 26 은 identity: null 이면 서명을 통째로 건너뛰고, "-" 를 줘야 ad-hoc 으로 서명한다
  # (app-builder-lib mac/MacTargetHelper.js). ad-hoc 이면 Gatekeeper 가 "확인되지 않은 개발자" 로만 막아
  # 우클릭 → 열기로 실행된다. hardenedRuntime 은 공증 없이는 의미가 없고 ad-hoc 과 함께 쓰면
  # 라이브러리 검증 예외 entitlement 를 요구하므로 끈다.
  identity: "-"
  hardenedRuntime: false
dmg:
  artifactName: wizbot-player-mac-${arch}.dmg
publish:
  provider: github
  owner: WisdomIT
  repo: wizbot
  # ⚠️ 기본값은 draft 다. release.yml 이 먼저 만들어 둔 릴리즈와 타입이 다르면
  # electron-builder 가 "existing type not compatible" 로 **에러 없이 업로드를 건너뛴다**
  # (실측: v1.1.0-alpha.1 에서 잡은 성공했는데 자산이 하나도 올라가지 않았다).
  # 프리릴리즈 태그일 때는 release.yml 이 -c.publish.releaseType 으로 덮는다.
  releaseType: release
