# 로컬 통합 실행용 compose (이미지를 이 리포에서 직접 빌드).
# 운영 배포는 homelab-wisdomserver/optional/wizbot (ghcr 이미지 + Traefik) 를 사용한다.
#
#   cp .env.docker.example .env.docker && $EDITOR .env.docker
#   docker compose --env-file .env.docker up -d --build
#   open http://localhost:3001

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wizbot
      MYSQL_USER: wizbot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "wizbot", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마 적용 (1회성). db healthy 후 실행되고 종료된다.
  migrate:
    build: { context: ., target: api }
    image: wizbot/api:local
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://wizbot:${MYSQL_PASSWORD}@db:3306/wizbot
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    image: wizbot/api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://wizbot:${MYSQL_PASSWORD}@db:3306/wizbot
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3001}
      CHZZK_ID: ${CHZZK_ID:-}
      CHZZK_SECRET: ${CHZZK_SECRET:-}
      CHZZK_BOT_CHANNEL_ID: ${CHZZK_BOT_CHANNEL_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/trpc/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: { context: ., target: web }
    image: wizbot/web:local
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      API_URL: http://api:3002
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # /login 은 정적 페이지라 API 상태와 무관하게 웹 프로세스 생존만 본다
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatbot:
    build: { context: ., target: chatbot }
    image: wizbot/chatbot:local
    restart: unless-stopped
    environment:
      API_URL: http://api:3002
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    depends_on:
      api: { condition: service_healthy }
    # 채널별 소켓/타이머를 메모리에 갖는 stateful 싱글턴 — replica 를 늘리지 말 것 (#29)

volumes:
  mysql-data:
