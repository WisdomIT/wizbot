name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 빌드/타입체크에만 쓰이는 더미 값 (실제 접속 없음)
  DATABASE_URL: mysql://ci:ci@localhost:3306/ci
  JWT_SECRET: ci-only-secret

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        # 버전은 package.json의 packageManager 필드에서 읽음

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @wizbot/api exec prisma generate

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @wizbot/web build

  # dev 브랜치 푸시마다 컨테이너 이미지를 ghcr.io 에 :dev 태그로 올린다 (Portainer 시험/스테이징 스택용).
  # 정식 릴리즈 태그(vX.Y.Z)는 release.yml 이 담당한다.
  docker-dev:
    name: image:dev ${{ matrix.app }}
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, chatbot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:dev
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
