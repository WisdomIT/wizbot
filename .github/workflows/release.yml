name: Release

# 릴리즈 = dev → main 머지 후 main 커밋에 vX.Y.Z 태그 푸시.
# 1) 태그가 main에 포함된 커밋인지 검증
# 2) 루트 Dockerfile 의 타깃(web/api/chatbot)별 이미지 빌드 → ghcr.io 푸시
# 3) GitHub Release 생성
# 4) PORTAINER_WEBHOOK_URL 시크릿이 있으면 Portainer 스택 재배포 webhook 호출
# (dev 브랜치의 :dev 이미지는 ci.yml 의 docker-dev 잡이 담당)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: 빌드할 ref (태그/브랜치). 비우면 현재 ref
        required: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Ensure commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::릴리즈 태그는 main에 머지된 커밋에만 붙일 수 있습니다."
            exit 1
          fi

  build:
    name: build & push ${{ matrix.app }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, chatbot]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 이미지 이름은 소문자만 허용 (metadata-action 도 소문자화하지만 명시)
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # 프리릴리즈(v1.3.0-alpha.1 처럼 태그에 '-' 가 있는 것)는 latest 를 덮지 않는다.
            # 덮으면 운영 스택이 끌어가는 이미지가 알파로 바뀐다 (#124)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    name: github release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 플레이어 앱 (#117) ──────────────────────────────────────────────────────
  #  앱과 웹은 버전 체계를 따로 쓰지 않는다. 릴리즈는 모노레포 전체를 대상으로 하고
  #  앱 설치 파일은 그 릴리즈에 첨부한다 — release 잡이 릴리즈를 만든 뒤에 돌려야
  #  electron-builder 가 새 draft 를 만들지 않고 기존 릴리즈에 올린다.
  #
  #  셀프호스트(Linux) 러너로는 dmg/exe 를 만들 수 없어 GitHub 호스트 러너를 쓴다.
  #  프리릴리즈 태그에서도 빌드한다 — electron-updater 는 allowPrerelease: false 라
  #  일반 사용자에게 내려가지 않고, 테스트 기기에서만 채널을 열어 받는다.
  app:
    name: player package (${{ matrix.os }})
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # apps/player/package.json 의 version 이 electron-updater 의 비교 기준이다.
      # 태그와 어긋나면 업데이트 판단이 틀어지므로 태그 값을 그대로 새긴다.
      # (v1.2.3 → 1.2.3, v1.3.0-alpha.1 → 1.3.0-alpha.1)
      - name: 태그 버전을 앱에 새긴다
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const f = 'apps/player/package.json';
            const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            console.log('player version =', pkg.version);
          " "$VERSION"

      - name: Package and publish
        working-directory: apps/player
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm package --publish always

  deploy:
    name: portainer redeploy
    needs: [build]
    # 프리릴리즈는 운영에 배포하지 않는다 — 알파 시험이 운영을 갈아끼우면 안 된다 (#124)
    if: needs.build.result == 'success' && !contains(github.ref_name, '-')
    #  ⚠ 반드시 self-hosted runner 에서 호출한다. GitHub 호스티드 러너(Azure ASN 8075)에서
    #  curl 로 호출하면 Cloudflare 의 Bot Fight Mode 가 managed_challenge 를 걸어 403 이 된다
    #  — curl 은 챌린지를 풀 수 없다. 서버 자신이 호출하면 걸리지 않는다. (#124)
    runs-on: [self-hosted, wisdomserver]
    environment: production
    steps:
      - name: Trigger Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL 시크릿이 없어 재배포를 건너뜁니다. Portainer 스택 > Webhook 에서 URL을 발급해 등록하세요."
            exit 0
          fi
          #  실패했을 때 원인을 남긴다 — 403 이 Cloudflare 차단인지 Portainer 거절인지
          #  응답 헤더(server / cf-ray / cf-mitigated)와 본문으로 갈린다. (#124)
          code=$(curl -sS -X POST "$WEBHOOK" \
            --max-time 600 -o /tmp/webhook-body -D /tmp/webhook-headers -w '%{http_code}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::운영 스택 재배포 실패 — HTTP $code"
            echo "--- 응답 헤더 ---"
            grep -iE '^(HTTP|server|cf-ray|cf-mitigated|content-type):' /tmp/webhook-headers || true
            echo "--- 응답 본문 ---"
            head -c 2000 /tmp/webhook-body || true
            exit 1
          fi
          echo "Portainer 재배포 webhook 호출 완료 (HTTP $code)"
